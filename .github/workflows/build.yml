name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test backend
        run: |
          go test ./internal/...
          go vet ./internal/...

  desktop:
    name: Build ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: build/bin/MyMinecraftGoLuncher.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: build/bin/MyMinecraftGoLuncher.app
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: build/bin/MyMinecraftGoLuncher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build desktop application
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -skipbindings
      - uses: actions/upload-artifact@v4
        with:
          name: MyMinecraftGoLuncher-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
