name: Official release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        default: '1.0.5'
      publish:
        description: 'Create the GitHub Release after all builds succeed'
        type: boolean
        default: false
      update_ota:
        description: 'Upload artifacts and update the LicensingGo OTA manifest'
        type: boolean
        default: true
      ota_tag:
        description: 'Update policy tag'
        type: choice
        options:
          - optional
          - mandatory
          - force
        default: optional

permissions:
  contents: write
  actions: read

concurrency:
  group: official-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.17.0

jobs:
  meta:
    name: Resolve release version
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      update_ota: ${{ steps.meta.outputs.update_ota }}
      ota_tag: ${{ steps.meta.outputs.ota_tag }}
    steps:
      - id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_UPDATE_OTA: ${{ inputs.update_ota }}
          INPUT_OTA_TAG: ${{ inputs.ota_tag }}
        run: |
          set -euo pipefail
          should_release=true
          publish=false
          update_ota=true
          ota_tag="${INPUT_OTA_TAG:-optional}"
          raw=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="${INPUT_VERSION:-}"
            publish="${INPUT_PUBLISH:-false}"
            update_ota="${INPUT_UPDATE_OTA:-true}"
          elif [ "$REF_TYPE" = "tag" ]; then
            raw="$REF_NAME"
            publish=true
            update_ota=true
          else
            raw="$(printf '%s' "${COMMIT_MESSAGE:-}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?' | head -1 || true)"
            if [ -z "$raw" ]; then
              # A normal master commit: do not build or publish.
              should_release=false
              raw="0.0.0"
            fi
          fi
          case "$raw" in
            *-force) ota_tag=force; raw="${raw%-force}" ;;
            *-mandatory) ota_tag=mandatory; raw="${raw%-mandatory}" ;;
          esac
          version="${raw#v}"
          if [ "$should_release" = "true" ] && ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::cannot resolve a release version from '$raw'"
            exit 1
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "update_ota=$update_ota" >> "$GITHUB_OUTPUT"
          echo "ota_tag=$ota_tag" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    needs: [meta]
    if: ${{ needs.meta.outputs.should_release == 'true' }}
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-version.mjs "$VERSION"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Security checks
        run: node scripts/security-check.mjs

      - name: Test backend
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Package web hot update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd frontend/dist && zip -r -q "$GITHUB_WORKSPACE/dist/MyGoLuncher-$VERSION-web.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/MyGoLuncher-${{ needs.meta.outputs.version }}-web.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.artifact }}
    needs: [meta, verify]
    if: ${{ needs.meta.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MGL_PRODUCT_API_KEY: ${{ secrets.MGL_PRODUCT_API_KEY }}
      MGL_PRODUCT_SERVER_URL: ${{ secrets.MGL_PRODUCT_SERVER_URL }}
      MGL_PRODUCT_NAME: ${{ vars.MGL_PRODUCT_NAME }}
      MGL_PRODUCT_SLUG: ${{ vars.MGL_PRODUCT_SLUG }}
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
          - os: macos-15
            platform: darwin/universal
            artifact: macos-universal
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-version.mjs "$VERSION"

      - name: Write official product configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-product-config.mjs

      - name: Build official desktop application
        shell: bash
        run: |
          set -euo pipefail
          wails build \
            -platform "${{ matrix.platform }}" \
            -tags mgl_private \
            -trimpath \
            -ldflags "-s -w -X MyMinecraftGoLuncher/internal/security.Enforce=true"

      - name: Remove private product configuration
        if: always()
        shell: bash
        run: rm -f internal/license/product_private.go

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upx = 'C:\ProgramData\chocolatey\bin\upx.exe'
          if (-not (Test-Path -LiteralPath $upx)) {
            choco install upx -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $upx)) {
            $command = Get-Command upx.exe -ErrorAction SilentlyContinue
            if ($command) { $upx = $command.Source }
          }
          if (-not (Test-Path -LiteralPath $upx)) { throw 'UPX installation failed' }
          "MGL_UPX_PATH=$upx" >> $env:GITHUB_ENV

      - name: Sign and package Windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) { throw 'WINDOWS_PFX_BASE64 secret is missing' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) { throw 'WINDOWS_PFX_PASSWORD secret is missing' }
          $version = $env:VERSION
          $exe = 'build/bin/MyMinecraftGoLuncher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "build output missing: $exe" }
          $upx = $env:MGL_UPX_PATH
          if ([string]::IsNullOrWhiteSpace($upx) -or -not (Test-Path -LiteralPath $upx)) {
            throw 'UPX is required to compress the Windows artifact'
          }
          & $upx --best --lzma --backup $exe
          if ($LASTEXITCODE -ne 0) { throw "UPX packing failed with exit code $LASTEXITCODE" }
          & $upx -t $exe
          if ($LASTEXITCODE -ne 0) { throw "UPX integrity test failed with exit code $LASTEXITCODE" }
          if (-not ([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))).Contains('UPX!')) {
            throw 'Windows artifact is not UPX-packed'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $env:MGL_SIGN_PFX_PASSWORD = $env:WINDOWS_PFX_PASSWORD
          & .\scripts\sign-windows.ps1 -Exe $exe -PfxPath $pfx -TimestampUrl "" -SkipVerify
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination "dist/MyGoLuncher-$version-windows-amd64.exe" -Force
          $stage = Join-Path $env:RUNNER_TEMP 'windows-package'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination $stage -Force
          Copy-Item -LiteralPath README.md, LICENSE -Destination $stage -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/MyGoLuncher-$version-windows-amd64.zip" -Force

      - name: Clean Windows signing material
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'code-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Sign and package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_SIGNING_IDENTITY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is missing"
              exit 1
            fi
          done
          VERSION="${VERSION:?VERSION is not set}"
          APP="build/bin/MyMinecraftGoLuncher.app"
          if [ ! -d "$APP" ]; then
            echo "::error::macOS app bundle is missing: $APP"
            exit 1
          fi
          PEM="$RUNNER_TEMP/macos-signing.pem"
          KEY="$RUNNER_TEMP/macos-signing-key.pem"
          CERT_ONLY="$RUNNER_TEMP/macos-signing-cert.pem"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | python3 -c 'import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$PEM"
          openssl pkey -in "$PEM" -out "$KEY"
          openssl x509 -in "$PEM" -out "$CERT_ONLY"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "Importing macOS private key"
          security import "$KEY" -k "$KEYCHAIN" -T /usr/bin/codesign
          echo "Importing macOS certificate"
          security import "$CERT_ONLY" -k "$KEYCHAIN"
          echo "Imported macOS identity"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          codesign --force --deep --options runtime --timestamp=none --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist
          STAGE="$RUNNER_TEMP/macos-package"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          (cd "$STAGE" && zip -r -q "$GITHUB_WORKSPACE/dist/MyGoLuncher-$VERSION-macos-universal.zip" .)

      - name: Clean macOS signing material
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/macos-signing.pem" "$RUNNER_TEMP/macos-signing-key.pem" "$RUNNER_TEMP/macos-signing-cert.pem"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION:?VERSION is not set}"
          BIN="build/bin/MyMinecraftGoLuncher"
          if [ ! -x "$BIN" ]; then
            echo "::error::Linux build output is missing: $BIN"
            exit 1
          fi
          STAGE="$RUNNER_TEMP/linux-package"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE build/linux/mygoluncher.desktop "$STAGE/"
          chmod +x "$STAGE/MyMinecraftGoLuncher"
          mkdir -p dist
          tar -C "$STAGE" -czf "dist/MyGoLuncher-$VERSION-linux-amd64.tar.gz" .
          sed "s/__VERSION__/$VERSION/g" packaging/nfpm-deb.yaml > "$RUNNER_TEMP/nfpm-deb.yaml"
          sed "s/__VERSION__/$VERSION/g" packaging/nfpm-rpm.yaml > "$RUNNER_TEMP/nfpm-rpm.yaml"
          nfpm package -f "$RUNNER_TEMP/nfpm-deb.yaml" -p deb -t "dist/MyGoLuncher-$VERSION-linux-amd64.deb"
          nfpm package -f "$RUNNER_TEMP/nfpm-rpm.yaml" -p rpm -t "dist/MyGoLuncher-$VERSION-linux-amd64.rpm"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  publish-ota:
    name: Upload artifacts and update LicensingGo OTA
    needs: [meta, build]
    if: ${{ needs.meta.outputs.should_release == 'true' && needs.meta.outputs.update_ota == 'true' }}
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MGL_PRODUCT_SERVER_URL: ${{ secrets.MGL_PRODUCT_SERVER_URL }}
      MGL_PRODUCT_NAME: ${{ vars.MGL_PRODUCT_NAME }}
      MGL_PRODUCT_SLUG: ${{ vars.MGL_PRODUCT_SLUG }}
      MGL_PRODUCT_ID: ${{ vars.MGL_PRODUCT_ID }}
      MGL_LICENSE_ADMIN_USERNAME: ${{ secrets.MGL_LICENSE_ADMIN_USERNAME }}
      MGL_LICENSE_ADMIN_PASSWORD: ${{ secrets.MGL_LICENSE_ADMIN_PASSWORD }}
      MGL_LICENSE_ADMIN_TOKEN: ${{ secrets.MGL_LICENSE_ADMIN_TOKEN }}
      MGL_OTA_TAG: ${{ needs.meta.outputs.ota_tag }}
      MGL_OTA_MIN_VERSION: ${{ vars.MGL_OTA_MIN_VERSION }}
      MGL_OTA_NOTES: ${{ vars.MGL_OTA_NOTES }}
      MGL_OTA_MANDATORY: ${{ vars.MGL_OTA_MANDATORY }}
      MGL_OTA_FORCE: ${{ vars.MGL_OTA_FORCE }}
      MGL_OTA_ALLOW_PARTIAL: ${{ vars.MGL_OTA_ALLOW_PARTIAL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Upload files and update OTA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-ota.mjs --version "$VERSION"

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    if: ${{ needs.meta.outputs.should_release == 'true' && needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate and sign checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION:?VERSION is not set}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "${LINUX_GPG_PRIVATE_KEY_BASE64:-}" ]; then
            echo "::error::LINUX_GPG_PRIVATE_KEY_BASE64 secret is missing"
            exit 1
          fi
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA256SUMS.txt.asc' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
          gpg --armor --export > linux-public-key.asc
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${LINUX_GPG_PASSPHRASE:-}" \
            --armor --detach-sign \
            --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: MyGoLuncher v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            MyGoLuncher v${{ steps.meta.outputs.version }} official build.

            - Windows: signed executable and zip
            - macOS: signed universal app zip
            - Linux: x86_64 tar.gz, .deb and .rpm
            - SHA256SUMS.txt and SHA256SUMS.txt.asc
