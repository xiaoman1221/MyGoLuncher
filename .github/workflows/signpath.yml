name: Sign Windows release

# Manual only. SignPath Foundation may reject projects with paid/commercial
# services; confirm eligibility before using this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build community Windows client
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          wails build -platform windows/amd64 -skipbindings

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: build/bin/MyMinecraftGoLuncher.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: signed/**/MyMinecraftGoLuncher.exe
          if-no-files-found: error
